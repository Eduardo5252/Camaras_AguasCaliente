<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo en Vivo - Cámara Agua Caliente</title>

    <!-- Librería HLS.js para reproducir flujos .m3u8 en Chrome/Edge -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        .video-container {
            width: 100%;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 500px;
            display: block;
        }
        .footer { font-size: 12px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MONITOREO EN VIVO</h1>
        <p>Cámara Agua Caliente — Transmisión continua para licitación pública</p>

        <div class="video-container">
            <video id="video" controls autoplay muted playsinline></video>
        </div>

        <div class="footer">
            © 2026 Todos los derechos reservados.
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://vtmvirginia.ezvizlife.com:4443/v3/openlive/BG7626702_1_1.m3u8?expire=1852517360&id=1023566877235458048&c=9246fc3de0&t=8cefeb72274cd747c06be85c452a46667bdf5f0efade155c0f1b54fc782df1b4&ev=100&u=cd5d0ebcbc3b4de5aace1cf0ad381be6';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
